runtime: nodejs22

instance_class: F2

env_variables:
  NODE_ENV: "production"
  PORT: "8080"
  GEMINI_API_KEY: "REDACTED_GCP_API_KEY"

handlers:
  - url: /.*
    script: auto
    secure: always

automatic_scaling:
  min_instances: 0
  max_instances: 3
  target_cpu_utilization: 0.65

entrypoint: node .next/standalone/server.js
